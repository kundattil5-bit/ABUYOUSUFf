    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var accordions = document.querySelectorAll('.accordion-collapse');
            accordions.forEach(function (accordion) {
                accordion.addEventListener('show.bs.collapse', function () {
                    accordions.forEach(function (otherAccordion) {
                        if (otherAccordion !== accordion && otherAccordion.classList.contains('show')) {
                            var bsCollapse = new bootstrap.Collapse(otherAccordion);
                            bsCollapse.hide();
                        }
                    });
                });
            });
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const filterButtons = document.querySelectorAll('.category-link');
            const products = document.querySelectorAll('.product-item');

            filterButtons.forEach(button => {

                button.addEventListener('click', function (e) {
                    e.preventDefault();

                    // Remove active class from all buttons
                    filterButtons.forEach(btn => {
                        btn.classList.remove('active');
                    });

                    // Add active class to clicked button
                    this.classList.add('active');

                    // Get selected filter
                    const filter = this.dataset.filter.toLowerCase();

                    products.forEach(product => {

                        const category = product.dataset.category.toLowerCase();

                        if (filter === 'all' || category === filter) {
                            product.style.display = 'block'; // show
                        } else {
                            product.style.display = 'none'; // hide
                        }

                    });

                });

            });

        });
    </script>
